<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Submit — ZOMBIE</title>
<link rel="icon" href="/Zombie.png" />
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:radial-gradient(circle at 50% 0%, #101010 0%, #000 58%);
    color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    min-height:100vh;padding:44px 20px 80px;
  }
  .wrap{max-width:500px;margin:0 auto;animation:rise .6s ease both}
  @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  .back{color:#888;text-decoration:none;font-size:13px;letter-spacing:1px}
  .back:hover{color:#fff}
  h1{font-size:30px;font-weight:600;letter-spacing:.5px;margin:24px 0 6px}
  .sub{color:#888;font-size:14px;margin-bottom:30px}
  label{display:block;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:#aaa;margin:20px 0 8px}
  label .opt{text-transform:none;letter-spacing:0;color:#666}
  input,textarea{
    width:100%;background:#0e0e0e;border:1px solid #2a2a2a;border-radius:3px;
    color:#fff;font:inherit;font-size:15px;padding:13px 14px;transition:border-color .15s;
  }
  input:focus,textarea:focus{outline:none;border-color:#777}
  textarea{min-height:160px;resize:vertical;line-height:1.6}
  .row{display:flex;gap:10px;align-items:center;margin-top:20px;font-size:14px;color:#aaa}
  .row input{width:auto;accent-color:#fff}
  button{
    margin-top:26px;width:100%;padding:16px;background:#fff;color:#000;border:none;border-radius:3px;
    font:inherit;font-size:13px;font-weight:600;letter-spacing:2.5px;text-transform:uppercase;cursor:pointer;
    transition:background .15s;
  }
  button:hover{background:#d6d6d6}
  .hint{color:#e10026;font-size:13px;margin-top:12px;min-height:1em}
  .ok{display:none;text-align:center;padding:40px 0;font-size:15px;color:#bbb;line-height:1.8}
  .ok a{color:#fff}
</style>
</head>
<body>
  <div class="wrap">
    <a class="back" href="/index">← back</a>
    <h1>Submit your story</h1>
    <p class="sub">The best ones get narrated on the channel.</p>

    <form id="f">
      <label>Title</label>
      <input id="title" type="text" />
      <label>Your story</label>
      <textarea id="story"></textarea>
      <label>Credit as <span class="opt">— optional</span></label>
      <input id="alias" type="text" />
      <label>Email <span class="opt">— optional</span></label>
      <input id="email" type="email" />
      <div class="row"><input id="consent" type="checkbox" /><span>Okay to narrate this on the channel.</span></div>
      <button type="submit">Send it in</button>
      <p class="hint" id="hint"></p>
    </form>

    <p class="ok" id="ok">Received.<br />If it makes the cut, you'll hear it on the channel.<br /><br /><a href="/index">← home</a></p>
  </div>

  <script>
    const f=document.getElementById('f');
    f.addEventListener('submit',function(e){
      e.preventDefault();
      const hint=document.getElementById('hint');
      const title=document.getElementById('title').value.trim();
      const story=document.getElementById('story').value.trim();
      if(!title||!story){hint.textContent='Add a title and your story first.';return;}
      if(!document.getElementById('consent').checked){hint.textContent='Tick the box so we can read it.';return;}
      const payload={title,story,alias:document.getElementById('alias').value.trim(),email:document.getElementById('email').value.trim()};
      // WIRE BACKEND HERE (Firebase / Formspree). For now logs only:
      console.log('submission',payload);
      f.style.display='none';
      document.getElementById('ok').style.display='block';
    });
  </script>
</body>
</html>
