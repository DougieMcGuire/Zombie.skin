<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Submit — ZOMBIE</title>
<link rel="icon" href="Zombie.png" />
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#000;color:#fff;font-family:Arial,Helvetica,sans-serif;min-height:100vh;padding:40px 20px}
  .wrap{max-width:520px;margin:0 auto}
  a.back{color:#888;text-decoration:none;font-size:14px}
  a.back:hover{color:#fff}
  h1{font-size:26px;margin:24px 0 20px;letter-spacing:1px}
  label{display:block;font-size:13px;margin:16px 0 6px;color:#bbb}
  input,textarea{width:100%;background:#0d0d0d;border:1px solid #333;color:#fff;font:inherit;font-size:15px;padding:11px}
  input:focus,textarea:focus{outline:none;border-color:#fff}
  textarea{min-height:150px;resize:vertical}
  .row{display:flex;gap:9px;align-items:center;margin-top:16px;font-size:14px;color:#bbb}
  .row input{width:auto}
  button{margin-top:20px;padding:13px 26px;background:#fff;color:#000;border:none;font:inherit;font-size:15px;text-transform:uppercase;letter-spacing:1px;cursor:pointer}
  .hint{color:#e10026;font-size:13px;margin-top:10px;min-height:1em}
  .ok{display:none;margin-top:20px;font-size:15px;color:#bbb}
</style>
</head>
<body>
  <div class="wrap">
    <a class="back" href="index.html">← back</a>
    <h1>Submit your story</h1>

    <form id="f">
      <label>Title</label>
      <input id="title" type="text" />
      <label>Your story</label>
      <textarea id="story"></textarea>
      <label>Credit as (optional)</label>
      <input id="alias" type="text" />
      <label>Email (optional)</label>
      <input id="email" type="email" />
      <div class="row"><input id="consent" type="checkbox" /><span>Okay to narrate this on the channel.</span></div>
      <button type="submit">Send it in</button>
      <p class="hint" id="hint"></p>
    </form>

    <p class="ok" id="ok">Received. If it makes the cut, you'll hear it on the channel. <a class="back" href="index.html">← home</a></p>
  </div>

  <script>
    const f=document.getElementById('f');
    f.addEventListener('submit',function(e){
      e.preventDefault();
      const hint=document.getElementById('hint');
      const title=document.getElementById('title').value.trim();
      const story=document.getElementById('story').value.trim();
      if(!title||!story){hint.textContent='Add a title and your story first.';return;}
      if(!document.getElementById('consent').checked){hint.textContent='Tick the box so we can read it.';return;}
      const payload={title,story,alias:document.getElementById('alias').value.trim(),email:document.getElementById('email').value.trim()};
      // WIRE BACKEND HERE (Firebase / Formspree). For now logs only:
      console.log('submission',payload);
      f.style.display='none';
      document.getElementById('ok').style.display='block';
    });
  </script>
</body>
</html>
