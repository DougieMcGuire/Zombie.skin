<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Submit — ZOMBIE</title>
<link rel="icon" href="Zombie.png" />
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;min-height:100vh;padding:44px 20px 80px}
  .wrap{max-width:500px;margin:0 auto}
  .back{color:#888;text-decoration:none;font-size:13px;letter-spacing:1px}
  .back:hover{color:#fff}
  h1{font-size:28px;font-weight:600;letter-spacing:.5px;margin:24px 0 6px}
  .sub{color:#888;font-size:14px;margin-bottom:28px}
  label{display:block;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:#aaa;margin:18px 0 7px}
  label .opt{text-transform:none;letter-spacing:0;color:#666}
  input,textarea{width:100%;background:#0d0d0d;border:1px solid #333;color:#fff;font:inherit;font-size:15px;padding:12px 13px;border-radius:3px;transition:border-color .15s}
  input:focus,textarea:focus{outline:none;border-color:#888}
  textarea{min-height:150px;resize:vertical;line-height:1.6}
  .row{display:flex;gap:10px;align-items:center;margin-top:18px;font-size:14px;color:#aaa}
  .row input{width:auto}
  button{margin-top:22px;width:100%;padding:14px;background:#fff;color:#000;border:none;border-radius:3px;font:inherit;font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:2px;cursor:pointer}
  button:hover{background:#ddd}
  .hint{color:#aaa;font-size:13px;margin-top:10px;min-height:1em}
  .ok{display:none;text-align:center;padding:36px 0;font-size:15px;color:#bbb;line-height:1.7}
  .ok a{color:#fff}
</style>
</head>
<body>
  <div class="wrap">
    <a class="back" href="index.html">← back</a>
    <h1>Submit your story</h1>
    <p class="sub">The best ones get narrated on the channel.</p>

    <form id="f">
      <label>Title</label>
      <input id="title" type="text" />
      <label>Your story</label>
      <textarea id="story"></textarea>
      <label>Credit as <span class="opt">— optional</span></label>
      <input id="alias" type="text" />
      <label>Email <span class="opt">— optional</span></label>
      <input id="email" type="email" />
      <div class="row"><input id="consent" type="checkbox" /><span>Okay to narrate this on the channel.</span></div>
      <button type="submit">Send it in</button>
      <p class="hint" id="hint"></p>
    </form>

    <p class="ok" id="ok">Received. If it makes the cut, you'll hear it on the channel. <a class="back" href="index.html">← home</a></p>
  </div>

  <script>
    const f=document.getElementById('f');
    f.addEventListener('submit',function(e){
      e.preventDefault();
      const hint=document.getElementById('hint');
      const title=document.getElementById('title').value.trim();
      const story=document.getElementById('story').value.trim();
      if(!title||!story){hint.textContent='Add a title and your story first.';return;}
      if(!document.getElementById('consent').checked){hint.textContent='Tick the box so we can read it.';return;}
      const payload={title,story,alias:document.getElementById('alias').value.trim(),email:document.getElementById('email').value.trim()};
      // WIRE BACKEND HERE (Firebase / Formspree). For now logs only:
      console.log('submission',payload);
      f.style.display='none';
      document.getElementById('ok').style.display='block';
    });
  </script>
</body>
</html>
