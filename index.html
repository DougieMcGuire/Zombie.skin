<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ZOMBIE</title>
<link rel="icon" href="/Zombie.png" />
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:radial-gradient(circle at 50% 42%, #101010 0%, #000 60%);
    color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    min-height:100vh;display:flex;flex-direction:column;
    align-items:center;justify-content:center;padding:40px;
  }
  .lockup{display:flex;flex-direction:column;align-items:center;animation:rise .7s ease both}
  .avatar{
    width:min(220px,52vw);height:min(220px,52vw);border-radius:50%;
    object-fit:cover;object-position:50% 20%;
    border:1px solid #1c1c1c;box-shadow:0 0 60px rgba(0,0,0,.8);
  }
  .word{width:min(480px,84vw);height:auto;margin-top:26px}

  .btns{display:flex;flex-direction:column;gap:13px;width:min(320px,84vw);margin-top:56px;animation:rise .7s ease .12s both}
  .btn{
    display:block;text-align:center;text-decoration:none;
    padding:16px;border-radius:3px;
    font-size:13px;font-weight:600;letter-spacing:2.5px;text-transform:uppercase;
    transition:all .18s ease;
  }
  .btn--primary{background:#fff;color:#000;border:1px solid #fff}
  .btn--primary:hover{background:#d6d6d6;border-color:#d6d6d6}
  .btn--ghost{background:transparent;color:#fff;border:1px solid #333}
  .btn--ghost:hover{border-color:#fff;background:rgba(255,255,255,.04)}

  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.lockup,.btns{animation:none}}
</style>
</head>
<body>
  <div class="lockup">
    <img class="avatar" src="/Zombie.png" alt="Zombie" />
    <img class="word" src="/ZombieBanner.png" alt="ZOMBIE" />
  </div>
  <div class="btns">
    <a class="btn btn--primary" href="/submit">Submit Story</a>
    <a class="btn btn--ghost" href="https://www.youtube.com/@%CE%96%CE%9F%CE%9C%CE%92%CE%99%CE%95" target="_blank" rel="noopener">Subscribe</a>
  </div>
</body>
</html>
