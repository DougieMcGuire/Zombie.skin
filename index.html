<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ZOMBIE</title>
<link rel="icon" href="Zombie.png" />
<style>
  *{box-sizing:border-box;margin:0;padding:0}

    background:#000;color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    min-height:100vh;display:flex;flex-direction:column;
    align-items:center;justify-content:center;padding:40px;
  }

  .word{width:min(440px,82vw);height:auto;margin-top:22px}
  .btns{display:flex;flex-direction:column;gap:12px;width:min(300px,82vw);margin-top:50px}
  .btn{display:block;text-align:center;text-decoration:none;padding:15px;border:1px solid #333;border-radius:3px;color:#fff;font-size:13px;letter-spacing:2px;text-transform:uppercase;transition:all .18s ease}
  .btn:hover{background:#fff;border-color:#fff;color:#000}
</style>
</head>
<body>
  <img class="avatar" src="Zombie.png" alt="Zombie" />
