<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Zombie.skin</title>
<script>
// GitHub Pages SPA redirect (rafgraph technique).
// pathSegmentsToKeep = 0 for a custom domain (zombie.skin) or user.github.io root site
// pathSegmentsToKeep = 1 for a project page (user.github.io/REPO/) — also set BASE:"/REPO" in index.html
var pathSegmentsToKeep = 0;
var l = window.location;
l.replace(
  l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
  l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
  l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
  (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
  l.hash
);
</script>
</head>
<body></body>
</html>
